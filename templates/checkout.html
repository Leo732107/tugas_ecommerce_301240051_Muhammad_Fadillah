{% extends 'layout.html' %}

{% block content %}

<h2 class="fw-bold mb-4">
Checkout
</h2>

<div class="card p-4">

<form method="POST">

<div class="mb-3">

<label>Nama Pembeli</label>

<input type="text"
name="nama"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Alamat</label>

<textarea name="alamat"
class="form-control"
required></textarea>

</div>

<h3 class="mb-4">
Total : Rp {{ total }}
</h3>

<button class="btn btn-custom w-100">

Buat Pesanan

</button>

</form>

</div>

{% endblock %}
