{% extends 'layout.html' %}

{% block content %}

<h2 class="fw-bold mb-4">
Tracking Pesanan
</h2>

{% for order in orders %}

<div class="card p-4 mb-3">

<h4>
Pesanan #{{ order.id }}
</h4>

<p>
Nama : {{ order.nama_pembeli }}
</p>

<p>
Total : Rp {{ order.total }}
</p>

<div class="badge bg-light text-dark p-2">

{{ order.status }}

</div>

</div>

{% endfor %}

{% endblock %}
